<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>신규상담 등록 플레이북</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 상담 일지처럼 한 줄 단 — 단계 선택 띠 + 단계 카드, 핵심 문장에 형광펜 */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#15313A; --muted:#566A70; --line:#D6E0DE;
  --accent:#1E6873; --accent-soft:#E0EDEE; --on-accent:#FFFFFF;
  --marker:#F7D96E; --marker-ink:#15313A;
  --bad:#A8442C; --bad-soft:#F7E7E2; --good:#256F47; --good-soft:#E2F0E7;
  --display:"Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171A; --surface:#172327; --ink:#E3ECEC; --muted:#9BB0B4; --line:#2A3B40;
  --accent:#7EC6CE; --accent-soft:#1C3439; --on-accent:#0F171A;
  --marker:#6E5A1C; --marker-ink:#FFF1C6;
  --bad:#F0947E; --bad-soft:#3A2521; --good:#84CFA2; --good-soft:#1B3326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171A; --surface:#172327; --ink:#E3ECEC; --muted:#9BB0B4; --line:#2A3B40;
  --accent:#7EC6CE; --accent-soft:#1C3439; --on-accent:#0F171A;
  --marker:#6E5A1C; --marker-ink:#FFF1C6;
  --bad:#F0947E; --bad-soft:#3A2521; --good:#84CFA2; --good-soft:#1B3326; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 14px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,38px);line-height:1.25;margin:6px 0 10px;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:62ch}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
h3{font-size:15px;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:0 0 10px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 16px var(--body);padding:14px 12px 12px;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:20px 60px}
.panel{display:flex;flex-direction:column;gap:22px}

/* 단계 띠 */
.steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px 8px 8px;font:500 15px var(--body);cursor:pointer}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.step[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step[aria-current="true"] .n{background:var(--on-accent);color:var(--accent)}

.stagehead{display:flex;flex-direction:column;gap:8px}
.chan{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}

.minds{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.minds{grid-template-columns:1fr}}
.mind{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.mind .who{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.mind p{margin:4px 0 0;font-family:var(--display);font-size:18px;line-height:1.55}

.goal{border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.goal b{display:block;font-size:13px;color:var(--accent);letter-spacing:.04em}
.goal span{font-size:19px;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 14px;font:500 15px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pdetail{margin-top:10px;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px}
.pdetail .plain{font-family:var(--display);font-size:18px;font-weight:700}
.pdetail p{margin:4px 0 0}

.scripts{display:flex;flex-direction:column;gap:12px}
.script{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.script .lbl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.script .lbl span{font-size:14px;font-weight:600;color:var(--muted)}
.say{font-family:var(--display);font-size:19px;line-height:1.7;margin:0;white-space:pre-line}
.say mark{background:linear-gradient(transparent 40%,var(--marker) 40%);color:var(--marker-ink);padding:0 2px}
.ph{color:var(--accent);font-weight:700}
.why{margin:10px 0 0;font-size:15px;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.copy{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 12px;font:500 14px var(--body);cursor:pointer}

.pairs{display:flex;flex-direction:column;gap:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
.pair div{padding:12px 14px;min-width:0;font-size:16px}
.pair .x{background:var(--bad-soft)}
.pair .o{background:var(--good-soft)}
.pair small{display:block;font-weight:600;font-size:13px;letter-spacing:.04em}
.pair .x small{color:var(--bad)} .pair .o small{color:var(--good)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font:600 15px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tip{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}

.insta{border:1px dashed var(--accent);border-radius:var(--r);padding:12px 16px;font-size:16px}
.insta b{color:var(--accent)}

.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:0 0 auto}
.check input:checked + span{text-decoration:line-through;color:var(--muted)}

.navbtns{display:flex;justify-content:space-between;gap:10px}
.navbtns button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.navbtns button:disabled{opacity:.35;cursor:default}

/* 망설임 · 페르소나 · 원리 */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.acc summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .q{font-family:var(--display);font-size:19px;font-weight:700}
details.acc summary .plus{flex:0 0 auto;color:var(--accent);font-size:22px;line-height:1;transition:transform .2s}
details.acc[open] summary .plus{transform:rotate(45deg)}
details.acc .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:4px 12px;font-size:16px}
.kv dt{color:var(--muted);font-weight:600;font-size:14px;padding-top:2px}
.kv dd{margin:0;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.sub{font-size:15px;color:var(--muted);margin:-4px 0 0}

.rule{background:var(--bad-soft);border-radius:var(--r);padding:14px 16px}
.rule h3{color:var(--bad)}
.rule ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.pgrid{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pcard .nm{font-size:14px;font-weight:600;color:var(--accent)}
.pcard .plain{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.4}
.pcard p{margin:0;font-size:16px}
.pcard .where{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="eyebrow">문의 전화 한 통부터 등록 후 2주까지</div>
  <h1>신규상담 등록 플레이북</h1>
  <p class="lead">단계마다 학부모와 학생의 속마음, 통하는 심리 원리, 그대로 써도 되는 말을 정리했습니다. 파란 글씨(<span class="ph">OO이</span>)만 우리 학원 내용으로 바꾸고, 말투는 원장님 것으로 고쳐 쓰세요.</p>
</div></header>

<nav class="tabs" aria-label="보기 선택"><div class="wrap" role="tablist">
  <button class="tab" role="tab" data-view="journey" id="t-journey">상담 여정 6단계</button>
  <button class="tab" role="tab" data-view="objections" id="t-objections">망설임 대응</button>
  <button class="tab" role="tab" data-view="personas" id="t-personas">유형별 학부모·학생</button>
  <button class="tab" role="tab" data-view="principles" id="t-principles">심리 원리 사전</button>
</div></nav>

<main class="wrap">
  <section class="panel" id="v-journey" role="tabpanel" aria-labelledby="t-journey"></section>
  <section class="panel" id="v-objections" role="tabpanel" aria-labelledby="t-objections" hidden></section>
  <section class="panel" id="v-personas" role="tabpanel" aria-labelledby="t-personas" hidden></section>
  <section class="panel" id="v-principles" role="tabpanel" aria-labelledby="t-principles" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const P = {
  reciprocity:{name:'상호성',plain:'먼저 받으면 갚고 싶어진다',how:'등록 전부터 쓸모 있는 것 하나를 먼저 줍니다. 시험 대비 팁, 학원 고를 때 볼 기준, 시험 범위 정리표.'},
  foot:{name:'작은 약속부터',plain:'작은 "네"가 큰 "네"로 이어진다',how:'첫 통화의 목표는 등록이 아니라 방문 약속입니다. 방문의 목표는 평생 등록이 아니라 4주 시도입니다.'},
  consistency:{name:'일관성',plain:'내 입으로 말한 것은 지키고 싶어진다',how:'목표 점수를 학생이 직접 말하게 하고, 상담 끝에 그 말을 다시 읽어줍니다.'},
  ikea:{name:'노력 효과',plain:'내가 손댄 것을 더 아낀다',how:'상담 전에 질문 3개에 답하게 하면, 상담은 "학원이 여는 자리"가 아니라 "우리가 함께 준비한 자리"가 됩니다.'},
  labeling:{name:'알아주기',plain:'내 마음을 정확히 말해주는 사람을 믿는다',how:'"~가 제일 걱정되시는 거죠?" 하고 학부모의 걱정을 한 문장으로 되돌려줍니다. 설명보다 먼저입니다.'},
  liking:{name:'호감·비슷함',plain:'나와 비슷한 사람에게 마음이 열린다',how:'같은 학교 학생, 비슷한 고민을 했던 학부모 이야기로 연결합니다.'},
  authority:{name:'구체적인 전문성',plain:'자세히 아는 사람을 전문가로 느낀다',how:'경력 자랑 대신 아이 시험지 한 장을 3분 동안 정확하게 짚어줍니다.'},
  contrast:{name:'대비 효과',plain:'나란히 놓으면 차이가 선명해진다',how:'지금 모습과 4주 뒤 모습을 숫자 하나로 나란히 보여줍니다.'},
  anchoring:{name:'기준점',plain:'처음 들은 숫자가 판단의 기준이 된다',how:'가격보다 목표 점수를 먼저 정해두면, 가격은 그 목표에 드는 비용으로 읽힙니다.'},
  goal:{name:'결승선 효과',plain:'목표가 가까워 보이면 힘이 난다',how:'"성적 올리기" 대신 "첫 달은 서술형 감점 0개"처럼 닿을 만한 목표를 줍니다.'},
  loss:{name:'손실 회피',plain:'얻는 기쁨보다 잃는 아픔이 약 두 배 크다',how:'"이 시기를 놓치면" 이야기는 상담 중 한 번만, 짧게. 이미 불안한 학부모에게는 쓰지 않습니다.'},
  regret:{name:'후회 회피',plain:'후회할까 봐 결정을 미룬다',how:'"4주 해보고 숫자로 같이 확인해요"처럼 되돌릴 수 있는 길을 보여줍니다.'},
  statusquo:{name:'현상 유지',plain:'바꾸는 일은 귀찮고 겁난다',how:'옮기는 수고를 학원이 대신 줄여줍니다. 시작 시점 안내, 기존 진도 이어받기, 교재 정리.'},
  choice:{name:'선택 줄이기',plain:'고를 게 많으면 아무것도 못 고른다',how:'반은 하나만 추천하고, 날짜는 두 개 중에 고르게 합니다.'},
  mental:{name:'나눠 보기',plain:'같은 돈도 나눠 보면 다르게 느낀다',how:'월 수업료를 수업 1회 단가로 나누고, 그 1회에 무엇이 들어가는지 말합니다.'},
  social:{name:'사회적 증거',plain:'다른 사람이 고른 곳이 안전해 보인다',how:'"같은 학교 2학년 3명이 이 반에 있어요"처럼 사실 그대로 말합니다.'},
  autonomy:{name:'자율성',plain:'내가 고른 것은 내가 지킨다',how:'중학생은 특히 강합니다. 반 시간, 첫 목표를 학생이 직접 고르게 합니다.'},
  pratfall:{name:'솔직한 약점',plain:'약점을 먼저 말하면 더 믿는다',how:'"숙제가 많은 편이라 맞지 않는 아이도 있어요"라고 먼저 말합니다.'},
  peakend:{name:'마무리 효과',plain:'가장 좋았던 순간과 마지막 장면이 기억에 남는다',how:'상담 마지막 5분, 그리고 1시간 안에 보내는 요약 카톡이 학원의 인상을 정합니다.'},
  endowment:{name:'소유 효과',plain:'이미 내 것 같으면 놓기 싫다',how:'"OO이 자리", 아이 이름이 붙은 4주 계획표를 보여줍니다.'},
  scarcity:{name:'희소성',plain:'귀한 것이 더 갖고 싶다',how:'실제 정원일 때만 사실대로 말합니다. 거짓 마감은 신뢰를 잃는 가장 빠른 길입니다.'}
};

const CH = {phone:'전화',visit:'대면',online:'온라인·카톡'};

const STAGES = [
{ short:'첫 문의', title:'첫 문의', chans:['전화','카톡·온라인','방문'],
  parent:'"여기가 우리 애한테 맞을까? 일단 가격이랑 시간표부터 알아보자. 몇 군데 더 물어봐야지."',
  student:'(대부분 아직 모릅니다. 엄마가 알아보는 중입니다.)',
  goal:'등록 설득이 아니라, 만나서 이야기할 이유를 만들어 방문 약속 잡기',
  ps:['foot','reciprocity','labeling','choice'],
  scripts:[
    {lbl:'가격을 먼저 물을 때', say:'수업료는 주 3회 기준 월 {OO만 원}이에요. 다만 아이마다 맞는 반이 달라서요, <mark>요즘 {OO이}가 수학에서 제일 막히는 게 어떤 거예요?</mark>',

/* helpers */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function rich(s){ // allow <mark>, {placeholder}
  return s.replace(/\{([^}]+)\}/g,'<span class="ph">$1</span>');
}
const plainText = s => s.replace(/<\/?mark>/g,'').replace(/\{([^}]+)\}/g,'$1');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1600);}
async function copyText(text, el){
  try{ await navigator.clipboard.writeText(text); toast('복사했어요'); }
  catch(e){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('글자를 선택해 두었어요. 길게 눌러 복사하세요'); }
}
function chipsHTML(ids, key){
  return `<div class="chips" data-key="${key}">${ids.map(id=>`<button class="chip" type="button" aria-pressed="false" data-p="${id}">${P[id].name}</button>`).join('')}</div><div class="pdetail" hidden></div>`;
}
function wireChips(root){
  root.querySelectorAll('.chips').forEach(box=>{
    const det = box.nextElementSibling;
    box.addEventListener('click',e=>{
      const b=e.target.closest('.chip'); if(!b) return;
      const on = b.getAttribute('aria-pressed')==='true';
      box.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
      if(on){det.hidden=true;return;}
      b.setAttribute('aria-pressed','true');
      const p=P[b.dataset.p];
      det.innerHTML=`<div class="plain">${p.plain}</div><p>${p.how}</p>`;
      det.hidden=false;
    });
  });
}
function wireCopy(root){
  root.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{
    copyText(b.dataset.text, b.closest('.script').querySelector('.say'));
  }));
}

    <div class="script"><div class="lbl"><span>${sc.lbl}</span><button class="copy" type="button" data-text="${esc(plainText(sc.say))}">복사</button></div>
    <p class="say">${rich(sc.say)}</p><p class="why">${sc.why}</p></div>`).join('')}</div></div>
  <div><h3>이 말 대신</h3><div class="pairs">${s.pairs.map(p=>`<div class="pair"><div class="x"><small>피할 말</small>${rich(p[0])}</div><div class="o"><small>바꿀 말</small>${rich(p[1])}</div></div>`).join('')}</div></div>
  <div><h3>채널별로</h3>
    <div class="seg" role="group" aria-label="채널">${Object.keys(CH).map(k=>`<button type="button" data-c="${k}" aria-pressed="${k===chan}">${CH[k]}</button>`).join('')}</div>
    <div class="tip" id="tipbox">${rich(s.tips[chan])}</div>
  </div>
  <div class="insta">${s.insta}</div>
  ${cur===4?ruleBox():''}
  <div class="navbtns"><button type="button" id="prev" ${cur===0?'disabled':''}>이전 단계</button><button type="button" id="next" ${cur===STAGES.length-1?'disabled':''}>다음 단계</button></div>`;
  v.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>{cur=+b.dataset.i;renderJourney();}));
  v.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
    chan=b.dataset.c; v.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    document.getElementById('tipbox').innerHTML=rich(s.tips[chan]);
  }));
  const go=d=>{cur+=d;renderJourney();document.getElementById('v-journey').scrollIntoView({behavior:'smooth',block:'start'});};
  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('next').onclick=()=>go(1);
  const act=v.querySelector('.step[aria-current="true"]'); if(act) act.scrollIntoView({block:'nearest',inline:'center'});
  wireChips(v); wireCopy(v);
}

  return arr.map((p,i)=>`<details class="acc" id="${pre}-${i}"><summary><span><span class="q">${p.t}</span><br><span class="sub" style="margin:0">${p.s}</span></span><span class="plus" aria-hidden="true">+</span></summary>
   <div class="body">
    <dl class="kv"><dt>알아보는 신호</dt><dd>${p.sign}</dd><dt>진짜 원하는 것</dt><dd>${p.need}</dd><dt>피할 것</dt><dd>${p.avoid}</dd></dl>
    <div class="script"><div class="lbl"><span>첫마디</span><button class="copy" type="button" data-text="${esc(plainText(p.first))}">복사</button></div><p class="say">${rich(p.first)}</p></div>
    ${chipsHTML(p.ps,pre)}
   </div></details>`).join('');
}
function renderPers(){
  const v=document.getElementById('v-personas');
  v.innerHTML=`<div><h2>유형별 학부모</h2><p class="sub" style="margin-top:6px">한 사람이 여러 유형을 겹쳐 가진 경우가 많습니다. 첫 통화의 신호로 가장 가까운 유형을 고르세요.</p></div>
  <div class="list">${personaBlock(PERS.parent,'pp')}</div>
  <div><h2>유형별 학생</h2><p class="sub" style="margin-top:6px">중학생 상담은 학생이 마음을 열어야 학부모도 결정합니다.</p></div>
  <div class="list">${personaBlock(PERS.student,'ps')}</div>`;
  wireChips(v); wireCopy(v);
}

/* 원리 사전 */
function renderPrin(){
  const v=document.getElementById('v-principles');
  const where={};
  STAGES.forEach((s,i)=>s.ps.forEach(id=>{(where[id]=where[id]||[]).push(`${i+1}. ${s.short}`);}));
  OBJ.forEach(o=>o.ps.forEach(id=>{(where[id]=where[id]||[]);if(!where[id].includes('망설임 대응'))where[id].push('망설임 대응');}));
  v.innerHTML=`<div><h2>심리 원리 사전</h2><p class="sub" style="margin-top:6px">이 플레이북에 쓰인 원리 ${Object.keys(P).length}가지를 쉬운 말로 풀었습니다.</p></div>
  <div class="pgrid">${Object.entries(P).map(([id,p])=>`<div class="pcard"><div class="nm">${p.name}</div><div class="plain">${p.plain}</div><p>${p.how}</p>
    <div class="where">${(where[id]||[]).map(w=>`<span class="pill">${w}</span>`).join('')}</div></div>`).join('')}</div>
  ${ruleBox()}`;
}

/* tabs + hash */
const VIEWS=['journey','objections','personas','principles'];
function show(view){
  if(!VIEWS.includes(view)) view='journey';
  VIEWS.forEach(k=>{
    document.getElementById('v-'+k).hidden = k!==view;
    document.getElementById('t-'+k).setAttribute('aria-selected', k===view);
  });
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const k=t.dataset.view; if(location.hash!=='#'+k) location.hash=k; else show(k);
  window.scrollTo({top:0});
}));
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
renderJourney(); renderObj(); renderPers(); renderPrin();
show(location.hash.slice(1));
</script>
